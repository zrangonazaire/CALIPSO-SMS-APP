
server:
  port: 8080

spring:
  application:
    name: calipso

  datasource:
    url: jdbc:postgresql://postgres:5432/calpso_sms_db
    username: calipso_user
    password: calipso_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
