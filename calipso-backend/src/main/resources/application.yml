
server:
  port: ${SERVER_PORT:8085}

calipso:
  security:
    platform-admin-user-ids: ${CALIPSO_PLATFORM_ADMIN_USER_IDS:}
    payment-webhook-secret: ${CALIPSO_PAYMENT_WEBHOOK_SECRET:}
    bootstrap:
      username: ${CALIPSO_SECURITY_BOOTSTRAP_USERNAME:}
      password: ${CALIPSO_SECURITY_BOOTSTRAP_PASSWORD:}
      email: ${CALIPSO_SECURITY_BOOTSTRAP_EMAIL:admin@calipso.ci}
      full-name: ${CALIPSO_SECURITY_BOOTSTRAP_FULL_NAME:Administrateur plateforme}
      company-name: ${CALIPSO_SECURITY_BOOTSTRAP_COMPANY_NAME:Calipso Platform}
  integrations:
    encryption-key: ${CALIPSO_INTEGRATIONS_ENCRYPTION_KEY:}

spring:
  config:
    import:
      - "optional:file:./calipso.local.properties"
      - "optional:file:./calipso-backend/calipso.local.properties"
      - "optional:file:./orange-sms.local.properties"
      - "optional:file:./calipso-backend/orange-sms.local.properties"

  application:
    name: calipso

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/calpso_sms_db}
    username: ${SPRING_DATASOURCE_USERNAME:calipso_user}
    password: ${SPRING_DATASOURCE_PASSWORD:calipso_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

sms:
  orange:
    token-url: "${ORANGE_SMS_TOKEN_URL:https://api.orange.com/oauth/v3/token}"
    outbound-url: "${ORANGE_SMS_OUTBOUND_URL:https://api.orange.com/smsmessaging/v1/outbound/{senderAddress}/requests}"
    subscription-url: "${ORANGE_SMS_SUBSCRIPTION_URL:https://api.orange.com/smsmessaging/v1/outbound/{senderAddress}/subscriptions}"
    contracts-url: "${ORANGE_SMS_CONTRACTS_URL:https://api.orange.com/sms/admin/v1/contracts?country=CIV}"
    basic-authorization: ${ORANGE_SMS_BASIC_AUTH:}
    client-id: ${ORANGE_SMS_CLIENT_ID:}
    client-secret: ${ORANGE_SMS_CLIENT_SECRET:}
    default-sender-address: "${ORANGE_SMS_SENDER_ADDRESS:+2250000}"
    default-country-code: ${ORANGE_SMS_COUNTRY_CODE:225}
    sender-name: ${ORANGE_SMS_SENDER_NAME:}
    delivery-receipt-url: ${ORANGE_SMS_DELIVERY_RECEIPT_URL:}
    delivery-receipt-subscription-id: ${ORANGE_SMS_DELIVERY_RECEIPT_SUBSCRIPTION_ID:}
    connect-timeout-seconds: ${ORANGE_SMS_CONNECT_TIMEOUT_SECONDS:10}
    request-timeout-seconds: ${ORANGE_SMS_REQUEST_TIMEOUT_SECONDS:30}

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:CALIPSO_PAY_CI}
    cinetpay:
      api-key: ${CINETPAY_API_KEY:}
      site-id: ${CINETPAY_SITE_ID:}
      notify-url: ${CINETPAY_NOTIFY_URL:http://localhost:8085/api/v1/subscription/payments/webhook}
      return-url: ${CINETPAY_RETURN_URL:http://localhost:4200/subscription}
    wave:
      api-key: ${WAVE_API_KEY:}
