limit_req_zone $binary_remote_addr zone=calipso_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=calipso_api:10m rate=10r/s;
map $http_x_forwarded_proto $calipso_scheme {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    limit_req_status 429;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location ~ ^/(actuator|swagger-ui|v3/api-docs)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(?:env|properties|sql|dump|log|map)$ { return 404; }

    location ~ ^/api/v1/auth/(login|register|setup|forgot-password|reset-password)$ {
        limit_req zone=calipso_auth burst=5 nodelay;
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $calipso_scheme;
        proxy_hide_header Server;
        add_header Cache-Control 'no-store' always;
    }
    location /api/ {
        limit_req zone=calipso_api burst=40 nodelay;
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $calipso_scheme;
        proxy_read_timeout 180s;
        proxy_hide_header Server;
        add_header Cache-Control 'no-store' always;
    }
    location = /index.html { add_header Cache-Control 'no-store' always; }
    location / { try_files $uri $uri/ /index.html; }
}
