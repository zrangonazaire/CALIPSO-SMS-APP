<div class="container-fluid">
  <div class="mb-4">
    <h2 class="page-title mb-1">Nouvelle campagne</h2>
    <p class="text-muted mb-0">
      Associez un profil, un modele SMS et la colonne Excel qui contient les destinataires.
    </p>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <div class="card atlas-card">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Entreprise</label>
          <select class="form-select" [(ngModel)]="selectedCompanyId" (ngModelChange)="loadProfiles()">
            <option *ngFor="let company of companies" [ngValue]="company.id">{{ company.name }}</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Profil</label>
          <select class="form-select" [(ngModel)]="profileId" (ngModelChange)="loadProfileData()">
            <option *ngFor="let profile of profiles" [ngValue]="profile.id">{{ profile.name }}</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Modele SMS</label>
          <select class="form-select" [(ngModel)]="form.templateId">
            <option *ngFor="let template of templates" [ngValue]="template.id">{{ template.name }}</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Variable destinataire SMS</label>
          <select class="form-select" [(ngModel)]="form.phoneVariableId">
            <option *ngFor="let variable of recipientVariables" [ngValue]="variable.id">
              {{ variable.code }} - {{ variable.label }}
            </option>
          </select>
          <div class="form-text" *ngIf="recipientVariables.length === 0">
            Aucune variable destinataire SMS. Allez dans Variables Excel et cochez "Cette colonne est le destinataire SMS".
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Nom</label>
          <input class="form-control" [(ngModel)]="form.name">
        </div>
        <div class="col-md-6">
          <label class="form-label">Description</label>
          <input class="form-control" [(ngModel)]="form.description">
        </div>
      </div>

      <button class="btn btn-atlas mt-4" (click)="createCampaign()" [disabled]="!form.templateId || !form.phoneVariableId || !form.name">
        Creer la campagne
      </button>
    </div>
  </div>
</div>
