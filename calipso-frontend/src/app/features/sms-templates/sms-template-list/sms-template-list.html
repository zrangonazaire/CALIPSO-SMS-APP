<div class="container-fluid">
  <div class="mb-4">
    <h2 class="page-title mb-1">Modeles SMS</h2>
    <p class="text-muted mb-0">Creez les messages avec variables Excel.</p>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <label class="form-label">Entreprise</label>
      <select class="form-select" [(ngModel)]="selectedCompanyId" (ngModelChange)="loadProfiles()">
        <option *ngFor="let company of companies" [ngValue]="company.id">{{ company.name }}</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Profil</label>
      <select class="form-select" [(ngModel)]="profileId" (ngModelChange)="loadTemplates()">
        <option *ngFor="let profile of profiles" [ngValue]="profile.id">{{ profile.name }}</option>
      </select>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card atlas-card">
        <div class="card-body">
          <h5 class="fw-bold mb-3">Nouveau modele</h5>
          <label class="form-label">Nom</label>
          <input class="form-control mb-3" [(ngModel)]="form.name">
          <label class="form-label">Contenu</label>
          <textarea class="form-control mb-4" rows="7" [(ngModel)]="form.content" [placeholder]="'Bonjour {{NOM_CLIENT}}...'"></textarea>
          <button class="btn btn-atlas w-100" (click)="createTemplate()" [disabled]="!profileId">Creer</button>
        </div>
      </div>
    </div>
    <div class="col-lg-8">
      <div class="card atlas-card">
        <div class="card-body">
          <h5 class="fw-bold mb-3">Modeles</h5>
          <table class="table align-middle">
            <thead><tr><th>Nom</th><th>Contenu</th><th>Statut</th></tr></thead>
            <tbody>
              <tr *ngFor="let template of templates">
                <td class="fw-semibold">{{ template.name }}</td>
                <td>{{ template.content }}</td>
                <td><span class="badge badge-soft-success">{{ template.active ? 'Actif' : 'Inactif' }}</span></td>
              </tr>
              <tr *ngIf="templates.length === 0"><td colspan="3" class="text-center text-muted py-4">Aucun modele.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
