services:
  postgres:
    image: postgres:15
    container_name: calpso_sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: calpso_sms_db
      POSTGRES_USER: calipso_user
      POSTGRES_PASSWORD: calipso_password
    ports:
      - "5433:5432"
    volumes:
      - calipso_sms_postgres_data:/var/lib/postgresql/data
    networks:
      - calipso_sms_network

